name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          proj=$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          echo "tag=$tag project=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $proj"
            exit 1
          fi

  validation:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build wheels (linux ${{ matrix.target }})
    needs: [check-version, validation]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: manylinux2014
          - target: aarch64
            manylinux: manylinux2014
          - target: x86_64
            manylinux: musllinux_1_2
          - target: aarch64
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --strip
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  macos:
    name: Build wheels (macos ${{ matrix.target }})
    needs: [check-version, validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runner: macos-latest
          - target: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Build wheels (windows ${{ matrix.target }})
    needs: [check-version, validation]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --strip
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    name: Build source distribution
    needs: [check-version, validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke-wheels:
    name: Install and exercise wheels (${{ matrix.runner }}, ${{ matrix.libc }})
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            libc: glibc
          - runner: ubuntu-24.04-arm
            libc: glibc
          - runner: ubuntu-latest
            libc: musl
          - runner: ubuntu-24.04-arm
            libc: musl
          - runner: macos-latest
            libc: native
          - runner: macos-15-intel
            libc: native
          - runner: windows-latest
            libc: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        if: matrix.libc != 'musl'
        with:
          python-version: "3.12"
      - name: Install compatible wheel and test
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          python -m pip install --only-binary=:all: numpy
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist rscopulas
          python -I scripts/smoke_wheel.py
      - name: Install and test musllinux wheel in Alpine
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work python:3.12-alpine sh -ec '
            python -m pip install --only-binary=:all: numpy
            python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist rscopulas
            python -I scripts/smoke_wheel.py
          '

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validation, linux, macos, windows, sdist, smoke-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rscopulas/
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
