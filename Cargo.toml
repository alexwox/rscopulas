[workspace]
members = [
    "crates/rscopulas-core",
    "crates/rscopulas-python",
    "crates/rscopulas-wasm",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["alwo"]
repository = "https://github.com/alexwox/rscopulas"
homepage = "https://github.com/alexwox/rscopulas"

[workspace.dependencies]
criterion = "0.8"
ndarray = { version = "0.17", features = ["serde"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11"
rscopulas = { version = "0.6.0", path = "crates/rscopulas-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# Only the special functions and scalar distributions are used; the default
# features pull in nalgebra and a second copy of rand.
statrs = { version = "0.18.0", default-features = false }
thiserror = "2.0"

[profile.profiling]
inherits = "release"
debug = 1
