[package]
name = "rscopulas"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rscopulas"
readme = "README.md"
description = "Core Rust library for fitting, evaluating, and sampling copula models and vine copulas"
keywords = ["copula", "statistics", "vines", "dependence", "probability"]
categories = ["mathematics", "science"]

[features]
default = []
cuda = []
metal = []

[dependencies]
ndarray.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
statrs.workspace = true
thiserror.workspace = true

# Browsers and Node have no OS entropy source that Rust can reach directly.
# `rand` gets its seed entropy from `getrandom`, which on this target needs
# its JavaScript backend switched on here and selected with
# `--cfg getrandom_backend="wasm_js"` (see `.cargo/config.toml`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "0.19.4", default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12040"] }

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "gaussian"
harness = false

[[bench]]
name = "cross_language"
harness = false
