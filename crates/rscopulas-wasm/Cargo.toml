[package]
name = "rscopulas-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebAssembly bindings for rscopulas: copula fitting, densities and sampling in browsers and Node.js"
readme = "README.md"
keywords = ["copula", "statistics", "vines", "wasm", "webassembly"]
publish = false

[lib]
# cdylib is the WebAssembly module; rlib lets `cargo test` run the
# binding logic natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
ndarray.workspace = true
rand.workspace = true
rscopulas.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
